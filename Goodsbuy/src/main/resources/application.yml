spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/goodsbuy}
    username: ${DB_USERNAME:goodsbuy}
    password: ${DB_PASSWORD:}
  mvc:
    view:
      prefix: /WEB-INF/view/
      suffix: .jsp
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
mybatis:
  configuration:
    map-underscore-to-camel-case: true
app:
  upload-path: ${UPLOAD_PATH:../multipartImg}
profileImage.upload.path: ${app.upload-path}/profileImage
productImage.upload.path: ${app.upload-path}/productImage
